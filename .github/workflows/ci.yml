name: Source verification

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm audit --omit=dev --audit-level=high
      - run: npm test
      - run: npm run lint
      - run: npm run build
      - name: Browser smoke — public fictional homepage
        run: |
          npx playwright install --with-deps chromium
          npm run start -- --port 3000 > /tmp/tablesignal-next.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3000/ >/dev/null; then break; fi
            sleep 2
          done
          npx playwright test e2e/v012-public.spec.ts

  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.lock
      - run: python -m pip install -r requirements.lock
      - run: python -m pip install pip-audit && pip-audit -r requirements.lock --no-deps
      - run: python -m pytest -q
      - run: PYTHONPATH=. python -m unittest discover -s tests -p 'test_location_billing_rules.py' -v

  migrations-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env: {POSTGRES_USER: ci, POSTGRES_PASSWORD: ci, POSTGRES_DB: ci}
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql+psycopg://ci:ci@localhost:5432/ci
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.lock
      - run: python -m pip install -r requirements.lock
      # The single schema authority (docs/MIGRATIONS.md); a second run must be a no-op.
      - run: python -m app.migrate
      - run: python -m app.migrate | tee /tmp/migrate-again.log && grep -q 'already current' /tmp/migrate-again.log
      - run: python -m alembic check
      - run: python -m alembic downgrade base && python -m app.migrate
      # Legacy adoption, concurrent startups, API/worker waiting for migrate, on real PostgreSQL.
      - run: python -m pytest -q tests/test_postgres_lifecycle.py
        env:
          TEST_POSTGRES_URL: postgresql+psycopg://ci:ci@localhost:5432/ci

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      # Real compose: PostgreSQL -> migrate -> API + worker -> frontend, auth over HTTP,
      # worker stability, restarts and a repeated `up`.
      - run: scripts/compose-smoke.sh
        env:
          SMOKE_PROJECT: tablesignal-ci

  journey:
    # docs/PRODUCT_PLAN.md M1: golden-path steps 2–7 in a real browser against the mock Square API.
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.lock
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: python -m pip install -r backend/requirements.lock
      - run: npm ci --no-audit --no-fund
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: scripts/journey.sh
        env:
          PYTHON: python
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: journey-traces
          path: frontend/test-results/
          retention-days: 7

  journey-clerk:
    # docs/PRODUCT_PLAN.md M2: the same journey against the real Clerk development instance.
    # Skips (passes) where the Clerk test secrets aren't available, e.g. Dependabot and fork PRs.
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
      CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
      GUESTLIFT_OIDC_ISSUER: ${{ secrets.GUESTLIFT_OIDC_ISSUER }}
    steps:
      - id: gate
        run: |
          if [ -z "$CLERK_SECRET_KEY" ]; then echo "::notice::Clerk test secrets not set; skipping the Clerk journey."; echo "run=false" >> "$GITHUB_OUTPUT"; else echo "run=true" >> "$GITHUB_OUTPUT"; fi
      - if: steps.gate.outputs.run == 'true'
        uses: actions/checkout@v7
      - if: steps.gate.outputs.run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.lock
      - if: steps.gate.outputs.run == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - if: steps.gate.outputs.run == 'true'
        run: python -m pip install -r backend/requirements.lock && cd frontend && npm ci --no-audit --no-fund && npx playwright install --with-deps chromium
      - if: steps.gate.outputs.run == 'true'
        run: scripts/journey.sh
        env:
          PYTHON: python
          JOURNEY_AUTH_MODE: clerk
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: journey-clerk-traces
          path: frontend/test-results/
          retention-days: 7

  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # gitleaks-action lists the PR's commits through the API on pull_request events.
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
