name: Source verification

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm audit --omit=dev --audit-level=high
      - run: npm test
      - run: npm run lint
      - run: npm run build
      - name: Browser smoke — public fictional homepage
        run: |
          npx playwright install --with-deps chromium
          npm run start -- --port 3000 > /tmp/tablesignal-next.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3000/ >/dev/null; then break; fi
            sleep 2
          done
          npx playwright test e2e/v012-public.spec.ts

  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.lock
      - run: python -m pip install -r requirements.lock
      - run: python -m pip install pip-audit && pip-audit -r requirements.lock --no-deps
      - run: python -m pytest -q
      - run: PYTHONPATH=. python -m unittest discover -s tests -p 'test_location_billing_rules.py' -v

  migrations-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env: {POSTGRES_USER: ci, POSTGRES_PASSWORD: ci, POSTGRES_DB: ci}
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql+psycopg://ci:ci@localhost:5432/ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.lock
      - run: python -m pip install -r requirements.lock
      - run: python -m alembic upgrade head
      - run: python -m alembic check
      - run: python -m alembic downgrade base && python -m alembic upgrade head

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t tablesignal-backend:ci backend
      - run: docker build -t tablesignal-frontend:ci frontend
      - name: Backend container boots and reports healthy
        run: |
          docker run -d --name api -p 8000:8000 tablesignal-backend:ci
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8000/api/health && exit 0; sleep 2; done
          docker logs api; exit 1

  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # gitleaks-action lists the PR's commits through the API on pull_request events.
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
