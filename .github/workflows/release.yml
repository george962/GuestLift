name: Release images

# Push a tag like v0.14.0 to publish versioned images. Roll back by redeploying an older tag.
on:
  push:
    tags: ['v*']

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      matrix:
        service: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        env:
          # Repo variable; the frontend bakes the public API URL in at build time.
          API_URL: ${{ vars.NEXT_PUBLIC_GUESTLIFT_API_URL }}
        run: |
          image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/tablesignal-${{ matrix.service }}
          args=()
          if [ "${{ matrix.service }}" = frontend ] && [ -n "$API_URL" ]; then args+=(--build-arg "NEXT_PUBLIC_GUESTLIFT_API_URL=$API_URL"); fi
          docker build "${args[@]}" -t "$image:${GITHUB_REF_NAME}" -t "$image:sha-${GITHUB_SHA::12}" ${{ matrix.service }}
          docker push --all-tags "$image"
