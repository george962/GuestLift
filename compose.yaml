# Developer-only deployment: local accounts and demo API remain LOCALHOST-BOUND.
# Do not expose these containers to the internet. Account/billing endpoints are foundations, not a security certification.
services:
  database:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: guestlift
      POSTGRES_PASSWORD: guestlift
      POSTGRES_DB: guestlift
    volumes:
      - guestlift_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U guestlift -d guestlift"]
      interval: 3s
      retries: 15
  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://guestlift:guestlift@database:5432/guestlift
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_GROWTH_PRICE_ID: ${STRIPE_GROWTH_PRICE_ID:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      GUESTLIFT_APP_URL: ${GUESTLIFT_APP_URL:-http://localhost:3000}
      GUESTLIFT_COOKIE_SECURE: "0"
      SQUARE_SANDBOX_ACCESS_TOKEN: ${SQUARE_SANDBOX_ACCESS_TOKEN:-}
      SQUARE_SANDBOX_APP_ID: ${SQUARE_SANDBOX_APP_ID:-}
      SQUARE_SANDBOX_APP_SECRET: ${SQUARE_SANDBOX_APP_SECRET:-}
      SQUARE_SANDBOX_REDIRECT_URI: ${SQUARE_SANDBOX_REDIRECT_URI:-http://localhost:8000/api/integrations/square/oauth/callback}
      TABLESIGNAL_CREDENTIAL_KEY: ${TABLESIGNAL_CREDENTIAL_KEY:-}
      GUESTLIFT_ENABLE_LLM: ${GUESTLIFT_ENABLE_LLM:-0}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-}
    depends_on:
      database:
        condition: service_healthy
    ports:
      - '127.0.0.1:8000:8000'
  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_GUESTLIFT_API_URL: http://localhost:8000
    depends_on:
      - backend
    ports:
      - '127.0.0.1:3000:3000'
volumes:
  guestlift_pg:
